<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="325" viewBox="0 0 1200 325" font-family="'JetBrains Mono','Fira Code','SFMono-Regular',Consolas,'Noto Sans Mono CJK TC','PingFang TC','Microsoft JhengHei',monospace">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#05070d"/><stop offset="1" stop-color="#0b1022"/></linearGradient>
  <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#00e5ff"/><stop offset="1" stop-color="#ff2bd6"/></linearGradient>
  <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#00e5ff" stroke-opacity=".05"/></pattern>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  
</defs>
<style>
  .blink{animation:blink 1.2s steps(2,start) infinite}
  @keyframes blink{to{visibility:hidden}}
  .fade{opacity:0;animation:fade .6s ease-out forwards}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .scan{animation:scan 6s linear infinite}
  @keyframes scan{from{transform:translateY(-60px)}to{transform:translateY(385px)}}
</style>
<rect width="1200" height="325" rx="14" fill="url(#bg)"/>
<rect width="1200" height="325" rx="14" fill="url(#grid)"/>
<rect x=".5" y=".5" width="1199" height="324" rx="14" fill="none" stroke="#1b2440"/>
<path d="M8 24V8H24" fill="none" stroke="#00e5ff" stroke-width="2" opacity=".7"/><path d="M1176 8H1192V24" fill="none" stroke="#00e5ff" stroke-width="2" opacity=".7"/><path d="M8 301V317H24" fill="none" stroke="#00e5ff" stroke-width="2" opacity=".7"/><path d="M1176 317H1192V301" fill="none" stroke="#00e5ff" stroke-width="2" opacity=".7"/>


<style>
  .walk{animation:walk 22s linear infinite}
  @keyframes walk{0%{transform:translate(150px,280px)}50%{transform:translate(1050px,280px)}100%{transform:translate(150px,280px)}}
  .face{animation:face 22s linear infinite}
  @keyframes face{0%,49.9%{transform:scaleX(1)}50%,99.9%{transform:scaleX(-1)}100%{transform:scaleX(1)}}
  .body{animation:bob .45s ease-in-out infinite alternate}
  @keyframes bob{to{transform:translateY(-2.5px)}}
  .fa{animation:step .45s ease-in-out infinite alternate}
  .fb{animation:step .45s ease-in-out infinite alternate-reverse}
  @keyframes step{from{transform:translateY(0)}to{transform:translateY(-4px)}}
  .tail{transform-origin:-38px -16px;animation:wag .9s ease-in-out infinite alternate}
  @keyframes wag{from{transform:rotate(-8deg)}to{transform:rotate(14deg)}}
  .eyes{animation:blinkeye 4s infinite}
  @keyframes blinkeye{0%,94%,100%{transform:scaleY(1)}96%{transform:translateY(-28px) scaleY(.1) translateY(28px)}}
  .heart{animation:float 3s ease-out infinite;opacity:0}
  @keyframes float{0%{opacity:0;transform:translate(0,0)}20%{opacity:1}100%{opacity:0;transform:translate(0,-26px)}}
</style>
<text x="28" y="34" font-size="12" fill="#5b6b8c" letter-spacing="2"><tspan fill="#00e5ff">▍</tspan>MEOW.EXE // PATROLLING THE FOOTER</text>
<line x1="24" y1="291" x2="1176" y2="291" stroke="#1b2440" stroke-width="1"/>
<line x1="24" y1="291" x2="1176" y2="291" stroke="#00e5ff" stroke-opacity=".35" stroke-dasharray="2 10"/>
<g class="walk">
  <ellipse cx="0" cy="10" rx="80" ry="8" fill="#000" opacity=".45"/>
  <g class="face"><g transform="scale(2)">
  <g class="tail"><path d="M-38 -16C-52 -18 -58 -28 -50 -36" fill="none" stroke="#2a2528" stroke-width="10" stroke-linecap="round"/>
    <path d="M-38 -16C-52 -18 -58 -28 -50 -36" fill="none" stroke="#b9b2b6" stroke-width="7" stroke-linecap="round"/></g>
  <g class="feet">
    <ellipse class="fa" cx="-24" cy="0" rx="7" ry="4.5" fill="#b9b2b6" stroke="#2a2528" stroke-width="1.5"/>
    <ellipse class="fb" cx="-10" cy="0" rx="7" ry="4.5" fill="#b9b2b6" stroke="#2a2528" stroke-width="1.5"/>
    <ellipse class="fa" cx="14" cy="0" rx="7" ry="4.5" fill="#b9b2b6" stroke="#2a2528" stroke-width="1.5"/>
    <ellipse class="fb" cx="28" cy="0" rx="7" ry="4.5" fill="#b9b2b6" stroke="#2a2528" stroke-width="1.5"/>
  </g>
  <g class="body">
    <path d="M14 -46L19 -63L29 -48Z" fill="#b9b2b6" stroke="#2a2528" stroke-width="1.8" stroke-linejoin="round"/>
    <path d="M30 -46L39 -60L42 -42Z" fill="#b9b2b6" stroke="#2a2528" stroke-width="1.8" stroke-linejoin="round"/>
    <path d="M18.5 -52L20 -58L24 -51Z" fill="#ff9ec7" opacity=".8"/>
    <path d="M-42 -8C-46 -32 -30 -50 -2 -50C24 -50 42 -44 45 -24C48 -6 42 0 32 0H-32C-39 0 -41 -3 -42 -8Z" fill="#b9b2b6" stroke="#2a2528" stroke-width="1.8"/>
    <path d="M20 -49.5V-44M26 -49.8V-43.5M32 -49V-44" stroke="#6d666a" stroke-width="2.6" stroke-linecap="round"/>
    <path d="M-22 -47C-24 -42 -24 -38 -22 -35M-12 -49.5C-14 -44 -14 -40 -12 -37" fill="none" stroke="#6d666a" stroke-width="2.6" stroke-linecap="round"/>
    <g class="eyes"><circle cx="21" cy="-28" r="2.4" fill="#2a2528"/><circle cx="35" cy="-28" r="2.4" fill="#2a2528"/></g>
    <path d="M25 -22.5Q26.5 -20.5 28 -22.5Q29.5 -20.5 31 -22.5" fill="none" stroke="#2a2528" stroke-width="1.3" stroke-linecap="round"/>
    <ellipse cx="15" cy="-21" rx="3.4" ry="2" fill="#ff9ec7" opacity=".7"/>
    <ellipse cx="40" cy="-21" rx="3" ry="2" fill="#ff9ec7" opacity=".7"/>
    <path d="M42 -26H50M42 -22H49" stroke="#2a2528" stroke-width="1" stroke-linecap="round" opacity=".6"/>
  </g>
    <text class="heart" x="34" y="-66" font-size="13" fill="#ff2bd6">♥</text>
  </g></g>
</g>
<rect class="scan" x="0" y="0" width="1200" height="40" fill="#00e5ff" opacity=".035"/>
</svg>